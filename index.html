<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card</title>
    
    <!-- Modern Elegant Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Linked Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Images -->
    <div id="background-container"></div>
    <div id="overlay"></div>

    <!-- Main Content -->
    <div class="container">
        <div class="logo-container">
            <img id="profile-logo" src="" alt="Profile Logo">
        </div>

        <div class="profile-info">
            <h1 id="profile-name"></h1>
            <div class="divider"></div>
            <p id="profile-title"></p>
        </div>

        <div class="links-container" id="links-container">
            <!-- Dynamic Links Injected Here -->
        </div>

        <div class="links-container" style="margin-top: 5px; animation-delay: 0.5s;">
            <a href="#" class="link-btn save-contact-btn" id="save-contact-btn">
                <span class="link-text">Save Contact</span>
            </a>
        </div>
    </div>

    <!-- Linked JavaScript -->
    <script src="script.js"></script>
</body>
</html>
